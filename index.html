<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --paper: #F4EDE0;
      --paper-edge: #E5DAC6;
      --ink: #231F20;
      --pencil: #6A635A;
      --red: #C83E31;
      --blue: #2952A3;
      --gold: #D49B27;
      --sheet: #FBF7EE;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Caveat", "Comic Sans MS", cursive, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #stage-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Diegetic Floating Paper Tabs (No sterile HUD bar!) */
    #corner-tabs {
      position: absolute;
      top: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 20;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    #level-scrap {
      position: absolute;
      top: 12px;
      left: 16px;
      background: var(--sheet);
      border: 2px solid var(--ink);
      border-radius: 3px 8px 4px 10px;
      padding: 4px 14px;
      font-size: 20px;
      font-weight: 700;
      transform: rotate(-1.6deg);
      box-shadow: 2px 3px 0 rgba(35, 31, 32, 0.2);
      z-index: 20;
      pointer-events: none;
    }

    .sketch-btn {
      appearance: none;
      position: relative;
      background: var(--sheet);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 6px 3px 8px 4px;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2px 3px 0 rgba(35, 31, 32, 0.25);
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
    }

    .sketch-btn:hover {
      transform: translateY(-2px) rotate(-1.5deg);
      box-shadow: 3px 5px 0 rgba(35, 31, 32, 0.3);
    }

    .sketch-btn:hover::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 2px;
      height: 2px;
      background: var(--red);
      transform: rotate(-1deg);
      border-radius: 2px;
    }

    .sketch-btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 1px 1px 0 rgba(35, 31, 32, 0.2);
    }

    .sketch-btn.ink-red {
      background: #F9E5E2;
      border-color: var(--red);
      color: #8F2218;
    }

    .sketch-btn.ink-blue {
      background: #E4ECF9;
      border-color: var(--blue);
      color: #1A3978;
    }

    .net-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      background: var(--pencil);
    }

    .status-dot.online { background: #3D9956; }
    .status-dot.waiting { background: var(--gold); }

    /* Physical Sketchbook Notebook Modal */
    #lobby-modal {
      position: absolute;
      inset: 0;
      background: rgba(35, 31, 32, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 18px;
    }

    #lobby-modal.hidden {
      display: none;
    }

    .notebook-page {
      position: relative;
      width: 100%;
      max-width: 490px;
      background: var(--sheet);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 27px,
        rgba(41, 82, 163, 0.13) 28px
      );
      border: 2.5px solid var(--ink);
      border-radius: 4px 12px 6px 14px;
      box-shadow: 7px 9px 0 rgba(35, 31, 32, 0.28);
      padding: 26px 26px 22px 34px;
      transform: rotate(-0.7deg);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Red notebook margin line */
    .notebook-page::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 22px;
      width: 1.5px;
      background: rgba(200, 62, 49, 0.35);
    }

    /* Masking tape strips on corners */
    .tape {
      position: absolute;
      width: 58px;
      height: 18px;
      background: rgba(235, 219, 178, 0.85);
      border: 1px dashed rgba(106, 99, 90, 0.45);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      pointer-events: none;
    }
    .tape.tl { top: -8px; left: 26px; transform: rotate(-11deg); }
    .tape.tr { top: -7px; right: 24px; transform: rotate(9deg); }

    .nb-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px dashed var(--pencil);
      padding-bottom: 8px;
    }

    .nb-title {
      font-size: 32px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: 0.01em;
    }

    .nb-sub {
      font-size: 18px;
      color: var(--pencil);
      margin-top: 2px;
    }

    .sketch-notes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 12px;
      padding: 8px 12px;
      border: 1.5px dashed var(--ink);
      border-radius: 6px 3px 5px 4px;
      background: rgba(244, 237, 224, 0.7);
      font-size: 18px;
    }

    .note-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .key-doodle {
      border: 1.5px solid var(--ink);
      border-radius: 4px 7px 3px 6px;
      padding: 0 7px;
      font-size: 15px;
      font-weight: 700;
      background: var(--sheet);
      white-space: nowrap;
    }

    .room-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .room-input {
      flex: 1;
      border: none;
      border-bottom: 2.5px solid var(--ink);
      background: transparent;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink);
      outline: none;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions-row .sketch-btn {
      flex: 1;
      text-align: center;
    }

    .lobby-status {
      font-size: 18px;
      color: var(--pencil);
      min-height: 22px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    /* Subtle Pencil Version Tag */
    #version-tag {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 15px;
      font-weight: 700;
      color: rgba(35, 31, 32, 0.42);
      pointer-events: none;
      z-index: 35;
      transform: rotate(-2deg);
    }

    /* Paper Note Toast */
    #toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px) rotate(-1deg);
      background: var(--sheet);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 4px 10px 5px 8px;
      padding: 5px 16px;
      font-size: 19px;
      font-weight: 700;
      box-shadow: 3px 4px 0 rgba(35, 31, 32, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 40;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) rotate(-1deg);
    }

    /* Touch Controls */
    #touch-controls {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
      z-index: 25;
    }

    #touch-controls.visible { display: flex; }

    .touch-pad {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .t-btn {
      width: 52px;
      height: 52px;
      border: 2px solid var(--ink);
      border-radius: 10px 6px 12px 7px;
      background: rgba(251, 247, 238, 0.9);
      box-shadow: 2px 3px 0 var(--ink);
      font-family: inherit;
      font-weight: 700;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .t-btn:active, .t-btn.active {
      background: var(--red);
      color: var(--sheet);
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }

    @media (max-width: 640px) {
      .sketch-notes { grid-template-columns: 1fr; }
      .notebook-page { padding: 20px 18px 18px 28px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage-wrap">
      <canvas id="game-canvas"></canvas>

      <div id="level-scrap">Аркуш 01 / 04 · 0</div>

      <div id="corner-tabs">
        <button class="sketch-btn" id="btn-restart" title="Перемалювати (R)">↺ Заново</button>
        <button class="sketch-btn" id="btn-mute">Звук: є</button>
        <button class="sketch-btn net-pill" id="btn-lobby">
          <span class="status-dot" id="net-dot"></span>
          <span id="net-label">Соло</span>
        </button>
      </div>

      <div id="touch-controls">

          <button class="t-btn" data-key="left">◀</button>

        </div>

          <button class="t-btn" data-key="roll">CTRL</button>

      </div>

      <div id="lobby-modal">
        <div class="notebook-page">
          <div class="tape tl"></div>
          <div class="tape tr"></div>

          <div class="nb-header">
            <div>
              <div class="nb-title">Скетчбук // На двох</div>
              <div class="nb-sub">живий лайн, туш і кооп без затримок</div>
            </div>

          </div>

          <div class="sketch-notes">
            <div class="note-row"><span>Кроки</span><span class="key-doodle">W A S D</span></div>
            <div class="note-row"><span>Стрибок (2 пера)</span><span class="key-doodle">SPACE</span></div>
            <div class="note-row"><span>Перекат (шарф)</span><span class="key-doodle">CTRL / C</span></div>

          <div>

            </div>

          <div class="actions-row">
            <button class="sketch-btn ink-red" id="btn-host">Створити (P1)</button>
            <button class="sketch-btn ink-blue" id="btn-join">Приєднатися (P2)</button>
            <button class="sketch-btn" id="btn-solo">Грати соло</button>
          </div>

          <div class="lobby-status">
            <span id="lobby-msg">Обери режим або скинь лінк другу.</span>
            <span id="ping-readout"></span>
          </div>
        </div>
      </div>

      <div id="version-tag">v0.3.0</div>
      <div id="toast">Скопійовано!</div>
    </div>
  </div>

  <script>
    (() => {
      // =========================================================
      // 1. TACTILE AUDIO (Pencil scratch, paper rustle, ink pop)
      // =========================================================
      let audioCtx = null;
      let muted = false;

      function ensureAudio() {
        if (muted) return null;
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playNoiseBurst(dur, filterFreq, vol) {
        const ctx = ensureAudio();
        if (!ctx || muted) return;
        const bufSize = Math.floor(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = filterFreq;
        const gain = ctx.createGain();
        gain.gain.value = vol;
        src.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        src.start();
      }

      function playSound(type) {
        const ctx = ensureAudio();
        if (!ctx || muted) return;
        const now = ctx.currentTime;

        if (type === 'paper') {
          playNoiseBurst(0.06, 2200, 0.05);
          return;
        }
        if (type === 'click') {
          playNoiseBurst(0.04, 1400, 0.08);
          return;
        }

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'jump') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(195, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.09);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'roll') {
          playNoiseBurst(0.12, 950, 0.12);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.13);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'land') {
          playNoiseBurst(0.05, 500, 0.09);
        } else if (type === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(392, now);
          osc.frequency.setValueAtTime(493.88, now + 0.09);
          osc.frequency.setValueAtTime(587.33, now + 0.18);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.start(now);
          osc.stop(now + 0.37);
        } else if (type === 'die') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(175, now);
          osc.frequency.linearRampToValueAtTime(60, now + 0.22);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      }

      document.querySelectorAll('.sketch-btn').forEach((btn) => {
        btn.addEventListener('mouseenter', () => playSound('paper'));
        btn.addEventListener('click', () => playSound('click'));
      });

      // =========================================================
      // 2. LEVELS (Hand-sketched Notebook Modules)
      // =========================================================
      const LEVELS = [
        {
          id: '01',
          title: 'Аркуш 01 · Проба пера',
          spawn: { x: 80, y: 420 },
          goal: { x: 1450, y: 380, w: 38, h: 60 },

          ],

          ]
        },
        {

          goal: { x: 1580, y: 220, w: 38, h: 60 },
          notes: [
            { x: 80, y: 325, text: 'Розгін + Стрибок + Перекат', sub: 'синій шарф — твій деш у повітрі' },

          ],

          ]
        },
        {

          title: 'Аркуш 03 · Живі блоки',
          spawn: { x: 70, y: 420 },
          goal: { x: 1680, y: 300, w: 38, h: 60 },
          notes: [
            { x: 70, y: 325, text: 'Рухомі ескізи', sub: 'стрибай у такт' },
            { x: 1130, y: 235, text: 'Вузька щілина', sub: 'притиснись на CTRL' }
          ],
          platforms: [
            { x: 0, y: 480, w: 250, h: 120 },

          ],
          movers: [

            { x: 1390, y: 360, w: 110, h: 26, ax: 1390, ay: 430, bx: 1390, by: 300, speed: 1.7 }
          ],

          ]
        },
        {
          id: '04',
          title: 'Аркуш 04 · Остання сторінка',
          spawn: { x: 70, y: 420 },
          goal: { x: 1820, y: 200, w: 38, h: 60 },
          notes: [
            { x: 70, y: 325, text: 'Фінал зошита', sub: 'не витрачай дарма дихання' }
          ],
          platforms: [
            { x: 0, y: 480, w: 220, h: 120 },
            { x: 310, y: 420, w: 140, h: 32 },
            { x: 540, y: 350, w: 150, h: 32 },
            { x: 1030, y: 350, w: 260, h: 34 },
            { x: 1100, y: 266, w: 120, h: 48 },
            { x: 1680, y: 260, w: 240, h: 340 }
          ],
          movers: [
            { x: 760, y: 350, w: 120, h: 26, ax: 740, ay: 350, bx: 880, by: 350, speed: 1.8 },
            { x: 1360, y: 320, w: 110, h: 26, ax: 1360, ay: 370, bx: 1520, by: 270, speed: 1.6 }
          ],
          hazards: [
            { x: 355, y: 406, w: 44, h: 14 },
            { x: 590, y: 336, w: 44, h: 14 },
            { x: 1240, y: 336, w: 40, h: 14 }
          ]
        }
      ];

      // =========================================================
      // 3. PHYSICS & BALANCED LIMITS CONSTANTS
      // =========================================================
      const CFG = {
        gravity: 1460,
        apexGravityMult: 0.62,
        apexVelThreshold: 115,
        maxFallSpeed: 760,
        wallSlideSpeed: 135,
        walkSpeed: 300,
        sprintSpeed: 455,
        accelGround: 2600,
        turnAccelGround: 4200,
        accelAir: 1750,
        jumpVel: 555,
        doubleJumpVel: 495,
        wallJumpVx: 360,
        wallJumpVy: 520,
        maxJumps: 2,
        coyoteTime: 0.13,
        jumpBuffer: 0.13,
        rollSpeed: 660,
        rollDuration: 0.22,
        rollCooldown: 0.68,
        staminaDrain: 34,
        staminaRegen: 32,
        staminaExhaustThreshold: 24,
        normalW: 28,
        normalH: 40,
        rollH: 22
      };

      // =========================================================
      // 4. GAME STATE & SKETCHBOOK TEXTURES
      // =========================================================
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');

      let currentLevelIdx = 0;
      let deaths = 0;
      let worldTime = 0;
      let winBannerTimer = 0;
      let screenShake = 0;
      let boilFrame = 0;
      let boilTimer = 0;

      // Subtle paper fiber texture
      const grainCanvas = document.createElement('canvas');
      grainCanvas.width = 160;
      grainCanvas.height = 160;
      const gctx = grainCanvas.getContext('2d');
      const imgData = gctx.createImageData(160, 160);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const v = 220 + Math.floor(Math.random() * 32);
        imgData.data[i] = v;
        imgData.data[i + 1] = v - 6;
        imgData.data[i + 2] = v - 14;
        imgData.data[i + 3] = 26;
      }
      gctx.putImageData(imgData, 0, 0);
      let paperPattern = null;

      function createPlayer(isRemote = false) {
        const sp = LEVELS[currentLevelIdx].spawn;
        return {
          x: sp.x,
          y: sp.y,
          vx: 0,
          vy: 0,
          w: CFG.normalW,
          h: CFG.normalH,
          facing: 1,
          grounded: false,
          coyoteTimer: 0,
          jumpBufferTimer: 0,
          jumpsLeft: CFG.maxJumps,
          rollTimer: 0,
          rollCooldownTimer: 0,
          airRollUsed: false,
          stamina: 100,
          exhausted: false,
          sprinting: false,
          scaleX: 1,
          scaleY: 1,
          rot: 0,
          ghosts: [],
          ridingMoverIdx: -1,
          wallDir: 0,
          wallJumpLock: 0,
          isRemote,
          tx: sp.x,
          ty: sp.y
        };
      }

      const localPlayer = createPlayer(false);
      const remotePlayer = createPlayer(true);
      const particles = [];

      function spawnParticles(x, y, color, count = 8, speed = 170) {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = (0.35 + Math.random() * 0.65) * speed;
          particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 40,
            size: 3 + Math.random() * 5,
            life: 0.25 + Math.random() * 0.25,
            maxLife: 0.5,
            color,
            rot: Math.random() * Math.PI
          });
        }
      }

      // =========================================================
      // 5. INPUT HANDLING (WASD + Space + Ctrl/C + Shift)
      // =========================================================
      const keys = { left: false, right: false, up: false, down: false, sprint: false };

      function triggerJump() {
        localPlayer.jumpBufferTimer = CFG.jumpBuffer;
      }

      function triggerRoll() {
        const p = localPlayer;
        if (p.rollTimer > 0 || p.rollCooldownTimer > 0) return;
        if (!p.grounded && p.airRollUsed) return;

        p.rollTimer = CFG.rollDuration;
        p.rollCooldownTimer = CFG.rollCooldown;
        if (!p.grounded) p.airRollUsed = true;

        const dir = keys.left ? -1 : keys.right ? 1 : p.facing;
        p.facing = dir;
        p.vx = dir * CFG.rollSpeed;
        p.vy = Math.min(p.vy, 40);
        p.scaleX = 1.45;
        p.scaleY = 0.62;
        playSound('roll');
        spawnParticles(p.x + p.w / 2, p.y + p.h, '#2952A3', 8, 190);
      }

      window.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
          e.preventDefault();
        }
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT') return;

        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = true;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.sprint = true;

        if (e.code === 'Space' && !e.repeat) triggerJump();
        if ((e.code === 'ControlLeft' || e.code === 'ControlRight' || e.code === 'KeyC') && !e.repeat) triggerRoll();
        if (e.code === 'KeyR' && !e.repeat) resetPlayerToSpawn(true);
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.sprint = false;

        if (e.code === 'Space' && localPlayer.vy < -180 && localPlayer.rollTimer <= 0) {
          localPlayer.vy *= 0.55;
        }
      });

      const touchWrap = document.getElementById('touch-controls');
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        touchWrap.classList.add('visible');
      }
      touchWrap.querySelectorAll('.t-btn').forEach((btn) => {
        const k = btn.dataset.key;
        const setKey = (val) => {
          if (k === 'left') keys.left = val;
          else if (k === 'right') keys.right = val;
          else if (k === 'down') keys.down = val;
          else if (k === 'sprint') keys.sprint = val;
          else if (k === 'jump' && val) triggerJump();
          else if (k === 'roll' && val) triggerRoll();
        };
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); btn.classList.add('active'); setKey(true); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); btn.classList.remove('active'); setKey(false); });
      });

      // =========================================================
      // 6. MULTIPLAYER (Hybrid: MQTT Signaling + Direct WebRTC P2P)
      // =========================================================
      let mqttClient = null;
      let rtcPc = null;
      let rtcDc = null;
      let p2pActive = false;
      let netMode = 'solo';
      let netConnected = false;
      let pingMs = 0;
      let lastPingSent = 0;
      let netSyncTimer = 0;
      let connectTimeout = null;
      let roomTopic = '';
      const myClientId = 'g_' + Math.random().toString(36).slice(2, 10);

      const BROKERS = [
        'wss://broker.emqx.io:8084/mqtt',
        'wss://broker.hivemq.com:8884/mqtt'
      ];
      let brokerIdx = 0;

      const RTC_CONFIG = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' }
        ]
      };

      function randomRoomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let out = '';
        for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
        return out;
      }

      const lobbyModal = document.getElementById('lobby-modal');
      const roomInput = document.getElementById('room-code');
      const lobbyMsg = document.getElementById('lobby-msg');
      const netDot = document.getElementById('net-dot');
      const netLabel = document.getElementById('net-label');
      const pingReadout = document.getElementById('ping-readout');

      function showToast(text) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1800);
      }

      function updateNetUI(statusText, stateClass) {
        netLabel.textContent = statusText;
        netDot.className = 'status-dot' + (stateClass ? ' ' + stateClass : '');
      }

      function cleanupRtc() {
        p2pActive = false;
        if (rtcDc) { try { rtcDc.close(); } catch (_) {} rtcDc = null; }
        if (rtcPc) { try { rtcPc.close(); } catch (_) {} rtcPc = null; }
      }

      function cleanupNet() {
        if (connectTimeout) {
          clearTimeout(connectTimeout);
          connectTimeout = null;
        }
        cleanupRtc();
        if (mqttClient) {
          try { mqttClient.end(true); } catch (_) {}
          mqttClient = null;
        }
        netConnected = false;
      }

      function sanitizeCode(val) {
        return (val || 'SKETCH1').toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 14) || 'SKETCH1';
      }

      function publishMqtt(payload) {
        if (!mqttClient || !mqttClient.connected || !roomTopic) return;
        try {
          payload.sender = myClientId;
          mqttClient.publish(roomTopic, JSON.stringify(payload), { qos: 0 });
        } catch (_) {}
      }

      function sendGameMsg(payload) {
        if (p2pActive && rtcDc && rtcDc.readyState === 'open') {
          try { rtcDc.send(JSON.stringify(payload)); return; } catch (_) {}
        }
        publishMqtt(payload);
      }

      function sendStatePacket() {
        if (!netConnected) return;
        const compact = [
          Math.round(localPlayer.x),
          Math.round(localPlayer.y),
          Math.round(localPlayer.vx),
          Math.round(localPlayer.vy),
          localPlayer.facing,
          Number(localPlayer.scaleX.toFixed(2)),
          Number(localPlayer.scaleY.toFixed(2)),
          Number(localPlayer.rollTimer.toFixed(2)),
          Number(localPlayer.rot.toFixed(2))
        ];
        if (p2pActive && rtcDc && rtcDc.readyState === 'open') {
          try { rtcDc.send('S|' + compact.join('|')); return; } catch (_) {}
        }
        publishMqtt({ t: 's', d: compact });
      }

      function applyRemoteStateArr(d) {
        remotePlayer.tx = d[0];
        remotePlayer.ty = d[1];
        remotePlayer.vx = d[2];
        remotePlayer.vy = d[3];
        remotePlayer.facing = d[4];
        remotePlayer.scaleX = d[5];
        remotePlayer.scaleY = d[6];
        remotePlayer.rollTimer = d[7];
        remotePlayer.rot = d[8];
      }

      function handleGameMessage(raw) {
        if (typeof raw === 'string' && raw.startsWith('S|')) {
          const parts = raw.slice(2).split('|').map(Number);
          if (parts.length >= 9) applyRemoteStateArr(parts);
          return;
        }
        let data = null;
        try { data = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (_) { return; }
        if (!data || data.sender === myClientId) return;

        if (!netConnected) {
          netConnected = true;
          updateNetUI((netMode === 'host' ? 'P1' : 'P2') + ' · Онлайн', 'online');
          lobbyMsg.textContent = 'Друг на аркуші! Граєте разом.';
          lobbyModal.classList.add('hidden');
          showToast('Друг підключився!');
          publishMqtt({ type: 'hello_ack', level: currentLevelIdx });
          sendStatePacket();
          if (netMode === 'host') startWebRtcOffer();
        }

        if (data.t === 's' && Array.isArray(data.d)) {
          applyRemoteStateArr(data.d);
        } else if (data.type === 'hello' || data.type === 'hello_ack') {
          if (netMode === 'host') {
            publishMqtt({ type: 'level', idx: currentLevelIdx });
            if (!rtcPc) startWebRtcOffer();
          } else if (typeof data.level === 'number' && data.level !== currentLevelIdx) {
            loadLevel(data.level, false);
          }
          sendStatePacket();
        } else if (data.type === 'level') {
          if (data.idx !== currentLevelIdx) loadLevel(data.idx, false);
        } else if (data.type === 'ping') {
          sendGameMsg({ type: 'pong', t: data.t });
        } else if (data.type === 'pong') {
          pingMs = Math.max(1, Math.round(performance.now() - data.t));
          pingReadout.textContent = pingMs + ' ms' + (p2pActive ? ' (P2P)' : '');
          if (netConnected) {
            const tag = p2pActive ? 'P2P ' : '';
            updateNetUI((netMode === 'host' ? 'P1' : 'P2') + ' · ' + tag + pingMs + 'ms', 'online');
          }
        } else if (data.type === 'rtc_offer' && netMode !== 'host') {
          handleWebRtcOffer(data.sdp);
        } else if (data.type === 'rtc_answer' && netMode === 'host') {
          if (rtcPc) rtcPc.setRemoteDescription(new RTCSessionDescription(data.sdp)).catch(() => {});
        } else if (data.type === 'rtc_ice') {
          if (rtcPc && data.cand) rtcPc.addIceCandidate(new RTCIceCandidate(data.cand)).catch(() => {});
        }
      }

      function setupDataChannel(dc) {
        rtcDc = dc;
        dc.onopen = () => {
          p2pActive = true;
          showToast('Прямий P2P активний!');
          sendStatePacket();
        };
        dc.onclose = () => { p2pActive = false; };
        dc.onmessage = (ev) => handleGameMessage(ev.data);
      }

      function createRtcPeer() {
        cleanupRtc();
        if (typeof RTCPeerConnection === 'undefined') return null;
        const pc = new RTCPeerConnection(RTC_CONFIG);
        rtcPc = pc;
        pc.onicecandidate = (ev) => {
          if (ev.candidate) publishMqtt({ type: 'rtc_ice', cand: ev.candidate });
        };
        pc.ondatachannel = (ev) => setupDataChannel(ev.channel);
        return pc;
      }

      function startWebRtcOffer() {
        const pc = createRtcPeer();
        if (!pc) return;
        const dc = pc.createDataChannel('game', { ordered: false, maxRetransmits: 0 });
        setupDataChannel(dc);
        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer).then(() => offer))
          .then((offer) => publishMqtt({ type: 'rtc_offer', sdp: offer }))
          .catch(() => {});
      }

      function handleWebRtcOffer(sdp) {
        const pc = createRtcPeer();
        if (!pc) return;
        pc.setRemoteDescription(new RTCSessionDescription(sdp))
          .then(() => pc.createAnswer())
          .then((ans) => pc.setLocalDescription(ans).then(() => ans))
          .then((ans) => publishMqtt({ type: 'rtc_answer', sdp: ans }))
          .catch(() => {});
      }

      function connectRoom(mode) {
        ensureAudio();
        if (typeof mqtt === 'undefined') {
          lobbyMsg.textContent = 'Бібліотека мережі ще вантажиться...';
          return;
        }
        cleanupNet();
        netMode = mode;
        const code = sanitizeCode(roomInput.value);
        roomInput.value = code;
        roomTopic = 'grids01/coop/room/' + code;

        lobbyMsg.textContent = 'Шукаю сторінку ' + code + '...';
        updateNetUI('Пошук...', 'waiting');

        connectTimeout = setTimeout(() => {
          if (!mqttClient || !mqttClient.connected) {
            if (brokerIdx < BROKERS.length - 1) {
              brokerIdx++;
              connectRoom(mode);
            } else {
              cleanupNet();
              lobbyMsg.textContent = 'Не вдалося відкрити зʼєднання. Спробуй ще раз.';
              updateNetUI('Помилка', '');
            }
          }
        }, 7000);

        try {
          mqttClient = mqtt.connect(BROKERS[brokerIdx], {
            clientId: myClientId + '_' + Date.now().toString(36),
            clean: true,
            reconnectPeriod: 2000,
            connectTimeout: 6000
          });

          mqttClient.on('connect', () => {
            if (connectTimeout) { clearTimeout(connectTimeout); connectTimeout = null; }
            mqttClient.subscribe(roomTopic, { qos: 0 }, (err) => {
              if (err) {
                lobbyMsg.textContent = 'Помилка входу: ' + err.message;
                return;
              }
              publishMqtt({ type: 'hello', level: currentLevelIdx, role: netMode });
              if (netMode === 'host') {
                lobbyMsg.textContent = 'Сторінка ' + code + ' відкрита! Копіюй лінк і кидай другу.';
                updateNetUI('Чекаю P2...', 'waiting');
                showToast('Код ' + code + ' готовий');
              } else {
                lobbyMsg.textContent = 'У кімнаті ' + code + '! Чекаю друга...';
                updateNetUI('Пошук P1...', 'waiting');
              }
            });
          });

          mqttClient.on('message', (_topic, raw) => handleGameMessage(raw.toString()));
          mqttClient.on('error', (err) => {
            lobbyMsg.textContent = 'Збій мережі: ' + (err && err.message ? err.message : 'помилка');
          });
        } catch (_) {
          lobbyMsg.textContent = 'Не вдалося підключитися.';
        }
      }

      document.getElementById('btn-host').addEventListener('click', () => connectRoom('host'));
      document.getElementById('btn-join').addEventListener('click', () => connectRoom('client'));
      document.getElementById('btn-solo').addEventListener('click', () => {
        ensureAudio();
        cleanupNet();
        netMode = 'solo';
        updateNetUI('Соло', '');
        lobbyModal.classList.add('hidden');
      });
      document.getElementById('btn-close-lobby').addEventListener('click', () => {
        ensureAudio();
        lobbyModal.classList.add('hidden');
      });
      document.getElementById('btn-lobby').addEventListener('click', () => {

      });

      document.getElementById('btn-copy-link').addEventListener('click', () => {
        const code = sanitizeCode(roomInput.value);

        if (navigator.clipboard && navigator.clipboard.writeText) {

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);

      document.getElementById('btn-mute').addEventListener('click', (e) => {

      });

      try {
        const params = new URLSearchParams(window.location.search);

        if (r) {
          roomInput.value = sanitizeCode(r);

          setTimeout(() => connectRoom('client'), 350);
        } else {
          roomInput.value = randomRoomCode();
        }
      } catch (_) {}

      // =========================================================
      // 7. LEVEL & PHYSICS ENGINE
      // =========================================================
      let activeMovers = [];

      function updateLevelScrap() {
        document.getElementById('level-scrap').textContent =
          'Аркуш ' + String(currentLevelIdx + 1).padStart(2, '0') + ' / ' + String(LEVELS.length).padStart(2, '0') + ' · ✕' + deaths;
      }

      function loadLevel(idx, broadcast = true) {
        currentLevelIdx = (idx + LEVELS.length) % LEVELS.length;
        updateLevelScrap();
        resetPlayerToSpawn(false);
        const sp = LEVELS[currentLevelIdx].spawn;
        remotePlayer.x = sp.x;
        remotePlayer.y = sp.y;
        remotePlayer.tx = sp.x;
        remotePlayer.ty = sp.y;
        if (broadcast && netConnected) {
          sendGameMsg({ type: 'level', idx: currentLevelIdx });
        }
      }

      function resetPlayerToSpawn(countDeath = false) {
        const sp = LEVELS[currentLevelIdx].spawn;
        const p = localPlayer;
        if (countDeath) {
          deaths++;
          updateLevelScrap();
          screenShake = 8;
          playSound('die');
          spawnParticles(p.x + p.w / 2, p.y + p.h / 2, '#C83E31', 14, 240);
        }
        p.x = sp.x;
        p.y = sp.y;
        p.vx = 0;
        p.vy = 0;
        p.ridingMoverIdx = -1;
        p.h = CFG.normalH;
        p.jumpsLeft = CFG.maxJumps;
        p.rollTimer = 0;
        p.airRollUsed = false;
        p.stamina = 100;
        p.exhausted = false;
        p.rot = 0;
        p.scaleX = 1.2;
        p.scaleY = 0.8;
      }

      function updateMovers(t, dt) {
        const prevT = t - dt;
        activeMovers = LEVELS[currentLevelIdx].movers.map((m, idx) => {
          const s = (Math.sin(t * m.speed) + 1) * 0.5;
          const prevS = (Math.sin(prevT * m.speed) + 1) * 0.5;
          const x = m.ax + (m.bx - m.ax) * s;
          const y = m.ay + (m.by - m.ay) * s;
          const px = m.ax + (m.bx - m.ax) * prevS;
          const py = m.ay + (m.by - m.ay) * prevS;
          return { idx, x, y, w: m.w, h: m.h, dx: x - px, dy: y - py };
        });
      }

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function updatePhysics(dt) {
        const p = localPlayer;
        const lvl = LEVELS[currentLevelIdx];
        updateMovers(worldTime, dt);
        const movers = activeMovers;
        const allSolids = lvl.platforms.concat(movers);

        if (p.ridingMoverIdx >= 0 && movers[p.ridingMoverIdx]) {
          const rm = movers[p.ridingMoverIdx];
          p.x += rm.dx;
          p.y += rm.dy;
        }

        for (const rm of movers) {
          if (rectsOverlap(p, rm)) {
            if (rm.dy < 0 && p.y + p.h > rm.y && p.y < rm.y) {
              p.y = rm.y - p.h;
              p.vy = Math.min(p.vy, 0);
              p.grounded = true;
            } else if (rm.dx > 0) {
              p.x = rm.x + rm.w;
            } else if (rm.dx < 0) {
              p.x = rm.x - p.w;
            }
          }
        }

        if (p.rollCooldownTimer > 0) p.rollCooldownTimer = Math.max(0, p.rollCooldownTimer - dt);
        if (p.jumpBufferTimer > 0) p.jumpBufferTimer = Math.max(0, p.jumpBufferTimer - dt);
        if (p.wallJumpLock > 0) p.wallJumpLock = Math.max(0, p.wallJumpLock - dt);

        const moveDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (moveDir !== 0 && p.rollTimer <= 0 && p.wallJumpLock <= 0) p.facing = moveDir;

        const wantsSprint = keys.sprint && moveDir !== 0 && p.rollTimer <= 0;
        if (wantsSprint && !p.exhausted && p.stamina > 0) {
          p.sprinting = true;
          p.stamina = Math.max(0, p.stamina - CFG.staminaDrain * dt);
          if (p.stamina === 0) p.exhausted = true;
        } else {
          p.sprinting = false;
          p.stamina = Math.min(100, p.stamina + CFG.staminaRegen * dt);
          if (p.exhausted && p.stamina >= CFG.staminaExhaustThreshold) p.exhausted = false;
        }

        // Sweat drops when exhausted
        if (p.exhausted && Math.random() < 0.2) {
          spawnParticles(p.x + p.w / 2 + (Math.random() - 0.5) * 14, p.y + 4, '#2952A3', 1, 55);
        }

        const targetH = (p.rollTimer > 0 || (keys.down && p.grounded)) ? CFG.rollH : CFG.normalH;
        if (targetH !== p.h) {
          const diff = p.h - targetH;
          if (targetH > p.h) {
            const testBox = { x: p.x, y: p.y + diff, w: p.w, h: targetH };
            const blocked = allSolids.some((s) => rectsOverlap(testBox, s));
            if (!blocked) {
              p.y += diff;
              p.h = targetH;
            }
          } else {
            p.y += diff;
            p.h = targetH;
          }
        }

        if (p.rollTimer > 0) {
          p.rollTimer -= dt;
          p.rot += p.facing * 18 * dt;
          if (Math.random() < 0.65) {
            p.ghosts.push({ x: p.x, y: p.y, w: p.w, h: p.h, alpha: 0.4 });
          }
          if (p.rollTimer <= 0) p.rot = 0;
        } else {
          p.rot = 0;
          const maxSpd = p.sprinting ? CFG.sprintSpeed : CFG.walkSpeed;
          const targetVx = moveDir * maxSpd;
          const turning = moveDir !== 0 && Math.sign(p.vx) !== 0 && Math.sign(p.vx) !== moveDir;
          const accel = p.grounded
            ? (turning ? CFG.turnAccelGround : CFG.accelGround)
            : CFG.accelAir;
          if (p.wallJumpLock <= 0) {
            if (p.vx < targetVx) p.vx = Math.min(targetVx, p.vx + accel * dt);
            else if (p.vx > targetVx) p.vx = Math.max(targetVx, p.vx - accel * dt);
          }
        }

        if (p.grounded) {
          p.coyoteTimer = CFG.coyoteTime;
          p.jumpsLeft = CFG.maxJumps;
          p.airRollUsed = false;
        } else {
          p.coyoteTimer = Math.max(0, p.coyoteTimer - dt);
        }

        if (p.jumpBufferTimer > 0) {
          if (p.coyoteTimer > 0) {
            p.vy = -CFG.jumpVel;
            p.grounded = false;
            p.coyoteTimer = 0;
            p.jumpBufferTimer = 0;
            p.jumpsLeft = CFG.maxJumps - 1;
            p.scaleX = 0.78;
            p.scaleY = 1.24;
            playSound('jump');
            spawnParticles(p.x + p.w / 2, p.y + p.h, '#231F20', 6, 120);
          } else if (p.wallDir !== 0 && !p.grounded) {
            p.vx = -p.wallDir * CFG.wallJumpVx;
            p.vy = -CFG.wallJumpVy;
            p.facing = -p.wallDir;
            p.wallJumpLock = 0.14;
            p.jumpBufferTimer = 0;
            p.scaleX = 0.78;
            p.scaleY = 1.24;
            playSound('jump');
            spawnParticles(p.x + (p.wallDir > 0 ? p.w : 0), p.y + p.h * 0.5, '#6A635A', 7, 140);
          } else if (p.jumpsLeft > 0) {
            p.vy = -CFG.doubleJumpVel;
            p.jumpsLeft--;
            p.jumpBufferTimer = 0;
            p.scaleX = 0.8;
            p.scaleY = 1.22;
            playSound('jump');
            spawnParticles(p.x + p.w / 2, p.y + p.h, '#D49B27', 8, 150);
          }
        }

        // Apex hang-time + gentle max fall speed + wall slide
        let grav = CFG.gravity;
        if (p.rollTimer > 0) grav *= 0.35;
        else if (keys.down && !p.grounded) grav *= 1.45;
        else if (!p.grounded && Math.abs(p.vy) < CFG.apexVelThreshold) grav *= CFG.apexGravityMult;

        p.vy = Math.min(CFG.maxFallSpeed, p.vy + grav * dt);
        if (p.wallDir !== 0 && !p.grounded && p.vy > CFG.wallSlideSpeed && moveDir === p.wallDir) {
          p.vy = CFG.wallSlideSpeed;
          if (Math.random() < 0.25) {
            spawnParticles(p.x + (p.wallDir > 0 ? p.w : 0), p.y + p.h * 0.7, '#6A635A', 1, 45);
          }
        }

        p.wallDir = 0;
        p.x += p.vx * dt;
        for (const s of allSolids) {
          if (rectsOverlap(p, s)) {
            // Corner correction: if barely clipping top edge of a ledge while moving horizontally, step up smoothly
            const overlapBottom = (p.y + p.h) - s.y;
            if (overlapBottom > 0 && overlapBottom <= 8 && p.vy >= -80) {
              p.y = s.y - p.h;
            } else {
              if (p.vx > 0) { p.x = s.x - p.w; p.wallDir = 1; }
              else if (p.vx < 0) { p.x = s.x + s.w; p.wallDir = -1; }
              p.vx = 0;
            }
          }
        }

        const wasGrounded = p.grounded;
        p.grounded = false;
        p.ridingMoverIdx = -1;
        p.y += p.vy * dt;
        for (const s of allSolids) {
          if (rectsOverlap(p, s)) {
            if (p.vy >= 0) {
              p.y = s.y - p.h;
              if (!wasGrounded && p.vy > 220) {
                p.scaleX = 1.32;
                p.scaleY = 0.7;
                playSound('land');
                spawnParticles(p.x + p.w / 2, p.y + p.h, '#6A635A', 5, 95);
              }
              p.vy = 0;
              p.grounded = true;
              if (typeof s.idx === 'number') p.ridingMoverIdx = s.idx;
            } else if (p.vy < 0) {
              p.y = s.y + s.h;
              p.vy = 0;
            }
          }
        }

        if (p.grounded && p.sprinting && Math.random() < 0.35) {
          spawnParticles(p.x + p.w / 2, p.y + p.h, '#6A635A', 1, 60);
        }

        p.scaleX += (1 - p.scaleX) * Math.min(1, 14 * dt);
        p.scaleY += (1 - p.scaleY) * Math.min(1, 14 * dt);

        for (let i = p.ghosts.length - 1; i >= 0; i--) {
          p.ghosts[i].alpha -= 2.4 * dt;
          if (p.ghosts[i].alpha <= 0) p.ghosts.splice(i, 1);
        }

        if (p.y > 760) {
          resetPlayerToSpawn(true);
          return;
        }
        if (p.rollTimer <= 0) {
          for (const h of lvl.hazards) {
            if (rectsOverlap(p, h)) {
              resetPlayerToSpawn(true);
              return;
            }
          }
        }

        if (winBannerTimer <= 0 && rectsOverlap(p, lvl.goal)) {
          winBannerTimer = 1.1;
          playSound('win');
          spawnParticles(lvl.goal.x + lvl.goal.w / 2, lvl.goal.y + 20, '#D49B27', 22, 260);
          setTimeout(() => {
            winBannerTimer = 0;
            loadLevel(currentLevelIdx + 1, true);
          }, 950);
        }
      }

      // =========================================================
      // 8. HAND-DRAWN SKETCHBOOK RENDERER (Line Boil + Hatching + Diegetic UI)
      // =========================================================
      const cam = { x: 0, y: 0 };

      function resizeCanvas() {
        const wrap = document.getElementById('stage-wrap');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(wrap.clientWidth * dpr);
        canvas.height = Math.floor(wrap.clientHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resizeCanvas);

      // Deterministic pseudo-random jitter for 3-frame "line boil"
      function boilOffset(seed, frame) {
        const n = Math.sin(seed * 12.9898 + frame * 78.233) * 43758.5453;
        return ((n - Math.floor(n)) - 0.5) * 2.2;
      }

      function drawInkedRect(x, y, w, h, seed, fill, hatch = false) {
        const f = boilFrame;
        const x1 = x + boilOffset(seed + 1, f);
        const y1 = y + boilOffset(seed + 2, f);
        const x2 = x + w + boilOffset(seed + 3, f);
        const y2 = y + boilOffset(seed + 4, f);
        const x3 = x + w + boilOffset(seed + 5, f);
        const y3 = y + h + boilOffset(seed + 6, f);
        const x4 = x + boilOffset(seed + 7, f);
        const y4 = y + h + boilOffset(seed + 8, f);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo((x1 + x2) / 2, y1 + boilOffset(seed + 9, f), x2, y2);
        ctx.quadraticCurveTo(x2 + boilOffset(seed + 10, f), (y2 + y3) / 2, x3, y3);
        ctx.quadraticCurveTo((x3 + x4) / 2, y3 + boilOffset(seed + 11, f), x4, y4);
        ctx.quadraticCurveTo(x4 + boilOffset(seed + 12, f), (y4 + y1) / 2, x1, y1);
        ctx.closePath();

        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }

        // Cross-hatching inside sketched platforms (preserve main path before clipping)
        if (hatch) {
          ctx.save();
          ctx.clip();
          ctx.strokeStyle = 'rgba(35, 31, 32, 0.18)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          for (let hx = x - h; hx < x + w + h; hx += 14) {
            ctx.moveTo(hx, y);
            ctx.lineTo(hx + h * 0.65, y + h);
          }
          ctx.stroke();
          ctx.restore();
        }

        // Rebuild hand-drawn ink outline so it strokes cleanly around the block
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo((x1 + x2) / 2, y1 + boilOffset(seed + 9, f), x2, y2);
        ctx.quadraticCurveTo(x2 + boilOffset(seed + 10, f), (y2 + y3) / 2, x3, y3);
        ctx.quadraticCurveTo((x3 + x4) / 2, y3 + boilOffset(seed + 11, f), x4, y4);
        ctx.quadraticCurveTo(x4 + boilOffset(seed + 12, f), (y4 + y1) / 2, x1, y1);
        ctx.closePath();
        ctx.strokeStyle = '#231F20';
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Slight sketch overshoot marks at corners
        ctx.strokeStyle = 'rgba(35, 31, 32, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x1 - 4, y1); ctx.lineTo(x1 + 5, y1);
        ctx.moveTo(x2, y2 - 4); ctx.lineTo(x2, y2 + 5);
        ctx.stroke();
      }

      function drawSketchPlayer(p, color, label, isLocal) {
        // Inked motion ghosts during roll
        for (const g of p.ghosts) {
          ctx.save();
          ctx.globalAlpha = g.alpha * 0.45;
          ctx.strokeStyle = '#2952A3';
          ctx.lineWidth = 2;
          ctx.strokeRect(g.x, g.y, g.w, g.h);
          ctx.restore();
        }

        const cx = p.x + p.w / 2;
        const bottom = p.y + p.h;
        const lean = p.sprinting ? p.facing * 0.14 : 0;

        // Character body with squash/stretch & line boil (clean, zero clutter indicators)
        ctx.save();
        ctx.translate(cx, bottom);
        ctx.scale(p.scaleX, p.scaleY);
        ctx.transform(1, 0, lean, 1, 0, 0);

        if (p.rollTimer > 0) {
          ctx.translate(0, -p.h / 2);
          ctx.rotate(p.rot);
          ctx.translate(0, p.h / 2);
        }

        const jx = boilOffset(101, boilFrame) * 0.6;
        const jy = boilOffset(102, boilFrame) * 0.6;

        // Sketchy inked character silhouette
        ctx.beginPath();
        ctx.moveTo(-p.w / 2 + jx, -p.h + jy);
        ctx.lineTo(p.w / 2 - jx, -p.h - jy);
        ctx.lineTo(p.w / 2 + jx, -jy);
        ctx.lineTo(-p.w / 2 - jx, jy);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#231F20';
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Expressive Face!
        const ex = p.facing > 0 ? 4 : -6;
        ctx.fillStyle = '#231F20';
        if (p.exhausted) {
          // Tired / panting eyes
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(ex - 4, -p.h + 11); ctx.lineTo(ex + 2, -p.h + 13);
          ctx.moveTo(ex + 4, -p.h + 11); ctx.lineTo(ex + 8, -p.h + 13);
          ctx.stroke();
          // Open panting mouth
          ctx.beginPath();
          ctx.ellipse(ex + 2, -p.h + 20, 3, 2 + Math.sin(worldTime * 16) * 0.9, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Lively expressive eyes
          ctx.beginPath();
          ctx.arc(ex - 2, -p.h + 12, 2.2, 0, Math.PI * 2);
          ctx.arc(ex + 6, -p.h + 12, 2.2, 0, Math.PI * 2);
          ctx.fill();
          // Smile or determined expression
          ctx.beginPath();
          ctx.lineWidth = 1.6;
          if (p.sprinting) {
            ctx.moveTo(ex - 1, -p.h + 19); ctx.lineTo(ex + 6, -p.h + 18);
          } else {
            ctx.arc(ex + 2, -p.h + 17, 3.2, 0.15, Math.PI - 0.15);
          }
          ctx.stroke();
        }

        ctx.restore();

        // Remote player label
        if (!isLocal) {
          ctx.save();
          ctx.fillStyle = '#2952A3';
          ctx.font = '700 18px "Caveat", cursive';
          ctx.textAlign = 'center';
          ctx.fillText(label, cx, p.y - 10);
          ctx.restore();
        }
      }

      function render() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        const lvl = LEVELS[currentLevelIdx];

        // Smooth velocity-guided camera (turning A/D never jerks the view)
        const velLeadX = Math.max(-75, Math.min(75, localPlayer.vx * 0.16));
        const targetCamX = localPlayer.x - w * 0.44 + velLeadX;
        const targetCamY = Math.max(-140, Math.min(120, localPlayer.y - h * 0.58));
        cam.x += (targetCamX - cam.x) * 0.065;
        cam.y += (targetCamY - cam.y) * 0.055;

        const sx = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
        const sy = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;

        // 1. Warm Sketchbook Paper Background
        ctx.fillStyle = '#F4EDE0';
        ctx.fillRect(0, 0, w, h);

        // Faint pencil notebook rules & dots
        ctx.save();
        ctx.strokeStyle = 'rgba(106, 99, 90, 0.12)';
        ctx.lineWidth = 1;
        const step = 48;
        const offX = ((-cam.x * 0.45) % step + step) % step;
        const offY = ((-cam.y * 0.45) % step + step) % step;
        ctx.beginPath();
        for (let gx = offX; gx < w; gx += step) {
          ctx.moveTo(gx, 0); ctx.lineTo(gx, h);
        }
        for (let gy = offY; gy < h; gy += step) {
          ctx.moveTo(0, gy); ctx.lineTo(w, gy);
        }
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(-cam.x + sx, -cam.y + sy);

        // 2. Handwritten Page Number & Margin Sketch Notes
        ctx.fillStyle = 'rgba(35, 31, 32, 0.09)';
        ctx.font = '700 120px "Caveat", cursive';
        ctx.fillText('#' + lvl.id, 38, 255);

        ctx.fillStyle = '#231F20';
        ctx.font = '700 24px "Caveat", cursive';
        ctx.fillText(lvl.title, 44, 282);

        for (const n of lvl.notes) {
          ctx.fillStyle = '#231F20';
          ctx.font = '700 23px "Caveat", cursive';
          ctx.fillText(n.text, n.x, n.y);
          ctx.fillStyle = '#6A635A';
          ctx.font = '500 18px "Caveat", cursive';
          ctx.fillText(n.sub, n.x, n.y + 20);
        }

        // 3. Hand-drawn Cross-Hatched Platforms
        const solids = lvl.platforms.concat(activeMovers);
        solids.forEach((s, i) => {
          drawInkedRect(s.x, s.y, s.w, s.h, i * 17 + 1, '#EAE0CE', true);
        });

        // 4. Inked Spikes / Hazards
        lvl.hazards.forEach((hz, i) => {
          ctx.save();
          ctx.fillStyle = '#C83E31';
          ctx.strokeStyle = '#231F20';
          ctx.lineWidth = 2;
          const teeth = Math.max(3, Math.floor(hz.w / 10));
          const tw = hz.w / teeth;
          ctx.beginPath();
          ctx.moveTo(hz.x, hz.y + hz.h);
          for (let t = 0; t < teeth; t++) {
            const j = boilOffset(i * 31 + t, boilFrame) * 1.1;
            ctx.lineTo(hz.x + t * tw + tw * 0.5 + j, hz.y - 2 + j);
            ctx.lineTo(hz.x + (t + 1) * tw, hz.y + hz.h);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });

        // 5. Hand-drawn Goal Flag
        const g = lvl.goal;
        drawInkedRect(g.x, g.y, g.w, g.h, 900, '#E9C46A', false);
        ctx.fillStyle = '#231F20';
        ctx.font = '700 20px "Caveat", cursive';
        ctx.textAlign = 'center';
        ctx.fillText('Фініш ★', g.x + g.w / 2, g.y - 8);

        // 6. Players
        if (netConnected) {
          drawSketchPlayer(remotePlayer, '#8FB3E8', 'Друг (P2)', false);
        }
        drawSketchPlayer(localPlayer, '#F29A8E', 'Ти', true);

        // 7. Ink Splatter Particles
        for (const pt of particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
          ctx.translate(pt.x, pt.y);
          ctx.rotate(pt.rot);
          ctx.fillStyle = pt.color;
          ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
          ctx.restore();
        }

        ctx.restore();

        // 8. Paper Fiber Overlay
        if (!paperPattern) paperPattern = ctx.createPattern(grainCanvas, 'repeat');
        if (paperPattern) {
          ctx.save();
          ctx.fillStyle = paperPattern;
          ctx.fillRect(0, 0, w, h);
          ctx.restore();
        }

        // 9. Diegetic Fatigue Vignette when Exhausted
        if (localPlayer.exhausted) {
          const grad = ctx.createRadialGradient(w / 2, h / 2, w * 0.25, w / 2, h / 2, w * 0.7);
          grad.addColorStop(0, 'rgba(35, 31, 32, 0)');
          grad.addColorStop(1, 'rgba(200, 62, 49, 0.26)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }

        // 10. Torn Paper Win Stamp
        if (winBannerTimer > 0) {
          ctx.save();
          ctx.translate(w / 2, h / 2);
          ctx.rotate(-0.03);
          drawInkedRect(-140, -32, 280, 64, 777, '#FBF7EE', false);
          ctx.fillStyle = '#231F20';
          ctx.font = '700 30px "Caveat", cursive';
          ctx.textAlign = 'center';
          ctx.fillText('Сторінку пройдено!', 0, 9);
          ctx.restore();
        }
      }

      // =========================================================
      // 9. MAIN LOOP
      // =========================================================
      let lastTs = 0;

      function loop(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.033, (ts - lastTs) / 1000);
        lastTs = ts;
        worldTime += dt;

        // 3-frame hand-drawn line boil (~7.5 fps)
        boilTimer += dt;
        if (boilTimer >= 0.13) {
          boilTimer = 0;
          boilFrame = (boilFrame + 1) % 3;
        }

        if (screenShake > 0) screenShake = Math.max(0, screenShake - 28 * dt);

        updatePhysics(dt);

        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.vy += 420 * dt;
          pt.rot += 5 * dt;
          pt.life -= dt;
          if (pt.life <= 0) particles.splice(i, 1);
        }

        if (netConnected) {
          remotePlayer.tx += remotePlayer.vx * dt;
          remotePlayer.ty += remotePlayer.vy * dt;
          remotePlayer.x += remotePlayer.vx * dt;
          remotePlayer.y += remotePlayer.vy * dt;

          const errX = remotePlayer.tx - remotePlayer.x;
          const errY = remotePlayer.ty - remotePlayer.y;
          if (Math.abs(errX) > 130 || Math.abs(errY) > 130) {
            remotePlayer.x = remotePlayer.tx;
            remotePlayer.y = remotePlayer.ty;
          } else {
            remotePlayer.x += errX * Math.min(1, 15 * dt);
            remotePlayer.y += errY * Math.min(1, 15 * dt);
          }

          netSyncTimer += dt;
          const syncInterval = p2pActive ? 0.025 : 0.075;
          if (netSyncTimer >= syncInterval) {
            netSyncTimer = 0;
            sendStatePacket();
          }
          if (ts - lastPingSent > 2000) {
            lastPingSent = ts;
            sendGameMsg({ type: 'ping', t: performance.now() });
          }
        }

        render();
        requestAnimationFrame(loop);
      }

      window.onload = () => {
        resizeCanvas();
        loadLevel(0, false);
        requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
