<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>index</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --paper: #F3EFE6;
      --paper-dark: #E6E0D3;
      --grid-line: #DFD9CA;
      --ink: #16161A;
      --ink-muted: #5A5962;
      --red: #E63926;
      --blue: #1D4ED8;
      --gold: #EAB308;
      --white: #FCFBF7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", "Inter", system-ui, -apple-system, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Top Swiss Architectural HUD */
    #hud {
      height: 60px;
      min-height: 60px;
      background: var(--white);
      border-bottom: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      z-index: 20;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-right: 12px;
      border-right: 2px solid var(--ink);
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      background: var(--red);
      box-shadow: 2px 2px 0 var(--ink);
    }

    /* Limit Meters */
    .meter-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meter-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .meter-label span.key {
      color: var(--ink);
      background: var(--paper-dark);
      padding: 0 4px;
      border: 1px solid var(--ink);
      font-size: 9px;
    }

    .pips-row {
      display: flex;
      gap: 5px;
      align-items: center;
      height: 14px;
    }

    .pip {
      width: 18px;
      height: 10px;
      border: 2px solid var(--ink);
      background: var(--ink);
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .pip.used {
      background: transparent;
      transform: scale(0.9);
    }

    .bar-track {
      width: 84px;
      height: 10px;
      border: 2px solid var(--ink);
      background: var(--paper);
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: var(--ink);
      transition: width 0.05s linear, background-color 0.15s ease;
    }

    .bar-fill.dash-ready {
      background: var(--blue);
    }

    .bar-fill.exhausted {
      background: var(--red);
    }

    /* Level & Net Controls */
    .level-pill {
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.06em;
      padding: 5px 10px;
      border: 2px solid var(--ink);
      background: var(--paper);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      appearance: none;
      border: 2px solid var(--ink);
      background: var(--white);
      color: var(--ink);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 10px;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.12s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--paper);
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }

    .btn.primary {
      background: var(--red);
      color: var(--white);
    }

    .btn.primary:hover {
      background: #cf2f1d;
    }

    .btn.blue {
      background: var(--blue);
      color: var(--white);
    }

    .btn.blue:hover {
      background: #173fb0;
    }

    .net-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 9px;
      border: 2px solid var(--ink);
      background: var(--paper);
      cursor: pointer;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-muted);
    }

    .status-dot.online {
      background: #16A34A;
    }

    .status-dot.waiting {
      background: var(--gold);
    }

    /* Game Stage */
    #stage-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Lobby / Multiplayer Modal */
    #lobby-modal {
      position: absolute;
      inset: 0;
      background: rgba(243, 239, 230, 0.88);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 16px;
    }

    #lobby-modal.hidden {
      display: none;
    }

    .swiss-card {
      width: 100%;
      max-width: 480px;
      background: var(--white);
      border: 3px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 12px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .card-sub {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .ctrl-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .ctrl-key {
      background: var(--white);
      border: 1.5px solid var(--ink);
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 900;
    }

    .room-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .room-input {
      flex: 1;
      border: 2px solid var(--ink);
      background: var(--paper);
      padding: 8px 10px;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      outline: none;
    }

    .room-input:focus {
      background: var(--white);
    }

    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions-row .btn {
      flex: 1;
      padding: 10px 12px;
      font-size: 12px;
      text-align: center;
    }

    .lobby-status {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      min-height: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Toast */
    #toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--white);
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 40;
      border: 2px solid var(--paper);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Touch Controls */
    #touch-controls {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
      z-index: 25;
    }

    #touch-controls.visible {
      display: flex;
    }

    .touch-pad {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .t-btn {
      width: 52px;
      height: 52px;
      border: 2px solid var(--ink);
      background: rgba(252, 251, 247, 0.9);
      box-shadow: 3px 3px 0 var(--ink);
      font-weight: 900;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .t-btn:active, .t-btn.active {
      background: var(--red);
      color: var(--white);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    @media (max-width: 820px) {
      #hud {
        height: auto;
        flex-wrap: wrap;
        padding: 8px 10px;
        gap: 8px;
      }
      .brand-tag {
        display: none;
      }
      .bar-track {
        width: 64px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-group">
        <div class="brand-tag">
          <div class="brand-dot"></div>

        </div>

        <div class="meter-block">

        <div class="meter-block">

        <div class="meter-block">

            </div>

          <div class="controls-grid">

          </div>

          <div>
            <div class="meter-label" style="margin-bottom:6px;">
              <span>Кімната для гри вдвох (P2P без затримки)</span>

          </div>

          <div class="actions-row">
            <button class="btn primary" id="btn-host">Створити (P1)</button>
            <button class="btn blue" id="btn-join">Приєднатися (P2)</button>

          <div class="lobby-status">
            <span id="lobby-msg">Обери режим або підключи друга за кодом кімнати.</span>
            <span id="ping-readout"></span>
          </div>
        </div>
      </div>

      <div id="toast">Скопійовано</div>

  </div>

  <script>
    (() => {
      // =========================================================
      // 1. AUDIO SYNTHESIZER (Tactile Minimalist Web Audio)
      // =========================================================
      let audioCtx = null;
      let muted = false;

      function ensureAudio() {
        if (muted) return null;
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playSound(type) {
        const ctx = ensureAudio();
        if (!ctx || muted) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'jump') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.exponentialRampToValueAtTime(460, now + 0.09);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'roll') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(170, now);
          osc.frequency.exponentialRampToValueAtTime(75, now + 0.14);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'land') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'win') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554.37, now + 0.08);
          osc.frequency.setValueAtTime(659.25, now + 0.16);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'die') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.linearRampToValueAtTime(65, now + 0.22);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      }

      // =========================================================
      // 2. LEVELS (Swiss Architectural Modules)
      // =========================================================
      const LEVELS = [
        {
          id: '01',
          title: 'МОДУЛЬ 01 // БАЛАНС',
          spawn: { x: 80, y: 420 },
          goal: { x: 1450, y: 380, w: 36, h: 60 },

            { x: 70, y: 330, text: 'WASD — РУХ', sub: 'SPACE — СТРИБОК (x2)' },
            { x: 480, y: 310, text: 'SHIFT — ПРИСКОРЕННЯ', sub: 'СТЕЖ ЗА ВИТРИВАЛІСТЮ' },
            { x: 960, y: 330, text: 'CTRL / C — ПЕРЕКАТ', sub: 'ПРОЇДЬ ПІД БАРʼЄРОМ' }
          ],

            { x: 1130, y: 240, text: 'НИЗЬКИЙ ПРОХІД', sub: 'ПЕРЕКАТ З РОЗГОНУ' }
          ],

          ],

        },
        {

          notes: [

          ],
          platforms: [

          ],
          movers: [
            { x: 760, y: 350, w: 120, h: 26, ax: 740, ay: 350, bx: 880, by: 350, speed: 1.8 },
            { x: 1360, y: 320, w: 110, h: 26, ax: 1360, ay: 370, bx: 1520, by: 270, speed: 1.6 }
          ],
          hazards: [
            { x: 355, y: 408, w: 44, h: 12 },
            { x: 590, y: 338, w: 44, h: 12 },
            { x: 1240, y: 338, w: 40, h: 12 }
          ]
        }
      ];

      // =========================================================
      // 3. PHYSICS & BALANCED LIMITS CONSTANTS
      // =========================================================
      const CFG = {
        gravity: 1680,
        walkSpeed: 295,
        sprintSpeed: 465,
        accelGround: 2400,
        accelAir: 1550,
        jumpVel: 585,
        doubleJumpVel: 520,
        maxJumps: 2,
        coyoteTime: 0.11,
        jumpBuffer: 0.11,
        rollSpeed: 690,
        rollDuration: 0.22,
        rollCooldown: 0.72,
        staminaDrain: 38,
        staminaRegen: 28,
        staminaExhaustThreshold: 26,
        normalW: 28,
        normalH: 40,
        rollH: 22
      };

      // =========================================================
      // 4. GAME STATE & ENTITIES
      // =========================================================
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');

      let currentLevelIdx = 0;
      let deaths = 0;
      let worldTime = 0;
      let winBannerTimer = 0;
      let screenShake = 0;

      // Pre-generate subtle paper grain pattern
      const grainCanvas = document.createElement('canvas');
      grainCanvas.width = 128;
      grainCanvas.height = 128;
      const gctx = grainCanvas.getContext('2d');
      const imgData = gctx.createImageData(128, 128);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const v = 225 + Math.floor(Math.random() * 25);
        imgData.data[i] = v;
        imgData.data[i + 1] = v - 4;
        imgData.data[i + 2] = v - 10;
        imgData.data[i + 3] = 28;
      }
      gctx.putImageData(imgData, 0, 0);
      let paperPattern = null;

      function createPlayer(isRemote = false) {
        const sp = LEVELS[currentLevelIdx].spawn;
        return {
          x: sp.x,
          y: sp.y,
          vx: 0,
          vy: 0,
          w: CFG.normalW,
          h: CFG.normalH,
          facing: 1,
          grounded: false,
          coyoteTimer: 0,
          jumpBufferTimer: 0,
          jumpsLeft: CFG.maxJumps,
          rollTimer: 0,
          rollCooldownTimer: 0,
          airRollUsed: false,
          stamina: 100,
          exhausted: false,
          sprinting: false,
          crouching: false,
          scaleX: 1,
          scaleY: 1,
          rot: 0,
          ghosts: [],
          ridingMoverIdx: -1,
          isRemote,
          tx: sp.x,
          ty: sp.y
        };
      }

      const localPlayer = createPlayer(false);
      const remotePlayer = createPlayer(true);
      const particles = [];

      function spawnParticles(x, y, color, count = 8, speed = 170) {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = (0.35 + Math.random() * 0.65) * speed;
          particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 40,
            size: 4 + Math.random() * 5,
            life: 0.25 + Math.random() * 0.25,
            maxLife: 0.5,
            color,
            rot: Math.random() * Math.PI
          });
        }
      }

      // =========================================================
      // 5. INPUT HANDLING (WASD + Space + Ctrl/C + Shift)
      // =========================================================
      const keys = {
        left: false,
        right: false,
        up: false,
        down: false,
        sprint: false
      };

      function triggerJump() {
        localPlayer.jumpBufferTimer = CFG.jumpBuffer;
      }

      function triggerRoll() {
        const p = localPlayer;
        if (p.rollTimer > 0 || p.rollCooldownTimer > 0) return;
        if (!p.grounded && p.airRollUsed) return;

        p.rollTimer = CFG.rollDuration;
        p.rollCooldownTimer = CFG.rollCooldown;
        if (!p.grounded) p.airRollUsed = true;

        const dir = keys.left ? -1 : keys.right ? 1 : p.facing;
        p.facing = dir;
        p.vx = dir * CFG.rollSpeed;
        p.vy = Math.min(p.vy, 40);
        p.scaleX = 1.45;
        p.scaleY = 0.62;
        playSound('roll');
        spawnParticles(p.x + p.w / 2, p.y + p.h, '#1D4ED8', 8, 190);
      }

      window.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
          e.preventDefault();
        }
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT') return;

        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = true;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.sprint = true;

        if (e.code === 'Space' && !e.repeat) {
          triggerJump();
        }
        if ((e.code === 'ControlLeft' || e.code === 'ControlRight' || e.code === 'KeyC') && !e.repeat) {
          triggerRoll();
        }
        if (e.code === 'KeyR' && !e.repeat) {
          resetPlayerToSpawn(true);
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.sprint = false;

        if (e.code === 'Space' && localPlayer.vy < -180 && localPlayer.rollTimer <= 0) {
          localPlayer.vy *= 0.55;
        }
      });

      // Touch controls setup
      const touchWrap = document.getElementById('touch-controls');
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        touchWrap.classList.add('visible');
      }
      touchWrap.querySelectorAll('.t-btn').forEach((btn) => {
        const k = btn.dataset.key;
        const setKey = (val) => {
          if (k === 'left') keys.left = val;
          else if (k === 'right') keys.right = val;
          else if (k === 'down') keys.down = val;
          else if (k === 'sprint') keys.sprint = val;
          else if (k === 'jump' && val) triggerJump();
          else if (k === 'roll' && val) triggerRoll();
        };
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); btn.classList.add('active'); setKey(true); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); btn.classList.remove('active'); setKey(false); });
      });

      // =========================================================
      // 6. MULTIPLAYER (MQTT over WSS — Zero NAT Issues)
      // =========================================================
      let mqttClient = null;
      let netMode = 'solo';
      let netConnected = false;
      let pingMs = 0;
      let lastPingSent = 0;
      let netSyncTimer = 0;
      let connectTimeout = null;
      let roomTopic = '';
      const myClientId = 'g_' + Math.random().toString(36).slice(2, 10);

      const BROKERS = [
        'wss://broker.emqx.io:8084/mqtt',
        'wss://broker.hivemq.com:8884/mqtt'
      ];
      let brokerIdx = 0;

      function randomRoomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let out = '';
        for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
        return out;
      }

      const lobbyModal = document.getElementById('lobby-modal');
      const roomInput = document.getElementById('room-code');
      const lobbyMsg = document.getElementById('lobby-msg');
      const netDot = document.getElementById('net-dot');
      const netLabel = document.getElementById('net-label');
      const pingReadout = document.getElementById('ping-readout');

      function showToast(text) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1800);
      }

      function updateNetUI(statusText, stateClass) {
        netLabel.textContent = statusText;
        netDot.className = 'status-dot' + (stateClass ? ' ' + stateClass : '');
      }

      function cleanupNet() {
        if (connectTimeout) {
          clearTimeout(connectTimeout);
          connectTimeout = null;
        }
        if (mqttClient) {
          try { mqttClient.end(true); } catch (_) {}
          mqttClient = null;
        }
        netConnected = false;
      }

      function sanitizeCode(val) {
        return (val || 'SWISS01').toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 14) || 'SWISS01';
      }

      function publishMsg(payload) {
        if (!mqttClient || !mqttClient.connected || !roomTopic) return;
        try {
          payload.sender = myClientId;
          mqttClient.publish(roomTopic, JSON.stringify(payload), { qos: 0 });
        } catch (_) {}
      }

      function sendStatePacket() {
        if (!netConnected) return;
        publishMsg({
          type: 'state',
          x: Math.round(localPlayer.x),
          y: Math.round(localPlayer.y),
          vx: Math.round(localPlayer.vx),
          vy: Math.round(localPlayer.vy),
          f: localPlayer.facing,
          sx: Number(localPlayer.scaleX.toFixed(2)),
          sy: Number(localPlayer.scaleY.toFixed(2)),
          rt: Number(localPlayer.rollTimer.toFixed(2)),
          rot: Number(localPlayer.rot.toFixed(2))
        });
      }

      function connectRoom(mode) {
        ensureAudio();
        if (typeof mqtt === 'undefined') {
          lobbyMsg.textContent = 'Бібліотека мережі ще не завантажилась. Онови сторінку (F5).';
          return;
        }
        cleanupNet();
        netMode = mode;
        const code = sanitizeCode(roomInput.value);
        roomInput.value = code;
        roomTopic = 'grids01/coop/room/' + code;

        lobbyMsg.textContent = 'Підключення до кімнати ' + code + '...';
        updateNetUI('Підключення...', 'waiting');

        connectTimeout = setTimeout(() => {
          if (!mqttClient || !mqttClient.connected) {
            if (brokerIdx < BROKERS.length - 1) {
              brokerIdx++;
              connectRoom(mode);
            } else {
              cleanupNet();
              lobbyMsg.textContent = 'Сервер не відповідає. Спробуй ще раз або обери Соло.';
              updateNetUI('Помилка', '');
            }
          }
        }, 7000);

        try {
          mqttClient = mqtt.connect(BROKERS[brokerIdx], {
            clientId: myClientId + '_' + Date.now().toString(36),
            clean: true,
            reconnectPeriod: 2000,
            connectTimeout: 6000
          });

          mqttClient.on('connect', () => {
            if (connectTimeout) { clearTimeout(connectTimeout); connectTimeout = null; }
            mqttClient.subscribe(roomTopic, { qos: 0 }, (err) => {
              if (err) {
                lobbyMsg.textContent = 'Не вдалося увійти в кімнату: ' + err.message;
                return;
              }
              publishMsg({ type: 'hello', level: currentLevelIdx, role: netMode });
              if (netMode === 'host') {
                lobbyMsg.textContent = 'Кімната ' + code + ' відкрита! Натисни «Копіювати лінк» і скинь другу.';
                updateNetUI('Чекаю P2...', 'waiting');
                showToast('Кімната ' + code + ' готова');
              } else {
                lobbyMsg.textContent = 'У кімнаті ' + code + '! Очікую сигнал від P1...';
                updateNetUI('Пошук P1...', 'waiting');
              }
            });
          });

          mqttClient.on('message', (_topic, raw) => {
            let data = null;
            try { data = JSON.parse(raw.toString()); } catch (_) { return; }
            if (!data || data.sender === myClientId) return;

            if (!netConnected) {
              netConnected = true;
              updateNetUI((netMode === 'host' ? 'P1' : 'P2') + ' • Онлайн', 'online');
              lobbyMsg.textContent = 'Друг підключився! Граєте в реальному часі.';
              lobbyModal.classList.add('hidden');
              showToast('Гравець підключився!');
              publishMsg({ type: 'hello_ack', level: currentLevelIdx });
              sendStatePacket();
            }

            if (data.type === 'hello' || data.type === 'hello_ack') {
              if (netMode === 'host') {
                publishMsg({ type: 'level', idx: currentLevelIdx });
              } else if (typeof data.level === 'number' && data.level !== currentLevelIdx) {
                loadLevel(data.level, false);
              }
              sendStatePacket();
            } else if (data.type === 'state') {
              remotePlayer.tx = data.x;
              remotePlayer.ty = data.y;
              remotePlayer.vx = data.vx;
              remotePlayer.vy = data.vy;
              remotePlayer.facing = data.f;
              remotePlayer.scaleX = data.sx;
              remotePlayer.scaleY = data.sy;
              remotePlayer.rollTimer = data.rt;
              remotePlayer.rot = data.rot;
            } else if (data.type === 'level') {
              if (data.idx !== currentLevelIdx) {
                loadLevel(data.idx, false);
              }
            } else if (data.type === 'ping') {
              publishMsg({ type: 'pong', t: data.t });
            } else if (data.type === 'pong') {
              pingMs = Math.max(1, Math.round(performance.now() - data.t));
              pingReadout.textContent = pingMs + ' ms';
              if (netConnected) {
                updateNetUI((netMode === 'host' ? 'P1' : 'P2') + ' • ' + pingMs + 'ms', 'online');
              }
            }
          });

          mqttClient.on('error', (err) => {
            lobbyMsg.textContent = 'Помилка мережі: ' + (err && err.message ? err.message : 'збій');
          });
        } catch (e) {
          lobbyMsg.textContent = 'Не вдалося підключитися.';
        }
      }

      document.getElementById('btn-host').addEventListener('click', () => connectRoom('host'));
      document.getElementById('btn-join').addEventListener('click', () => connectRoom('client'));
      document.getElementById('btn-solo').addEventListener('click', () => {
        ensureAudio();
        cleanupNet();
        netMode = 'solo';
        updateNetUI('Соло', '');
        lobbyModal.classList.add('hidden');
      });
      document.getElementById('btn-close-lobby').addEventListener('click', () => {
        ensureAudio();
        lobbyModal.classList.add('hidden');
      });
      document.getElementById('btn-lobby').addEventListener('click', () => {
        lobbyModal.classList.remove('hidden');
      });

      document.getElementById('btn-copy-link').addEventListener('click', () => {
        const code = sanitizeCode(roomInput.value);
        const url = window.location.href.split('?')[0] + '?room=' + encodeURIComponent(code);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(() => showToast('Лінк скопійовано!')).catch(() => fallbackCopy(url));
        } else {
          fallbackCopy(url);
        }
      });

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('Лінк скопійовано!'); } catch (_) {}
        document.body.removeChild(ta);
      }

      document.getElementById('btn-restart').addEventListener('click', () => resetPlayerToSpawn(true));
      document.getElementById('btn-mute').addEventListener('click', (e) => {
        muted = !muted;
        e.target.textContent = 'Звук: ' + (muted ? 'OFF' : 'ON');
      });

      try {
        const params = new URLSearchParams(window.location.search);
        const r = params.get('room');
        if (r) {
          roomInput.value = sanitizeCode(r);
          lobbyMsg.textContent = 'Код кімнати підставлено! Автопідключення...';
          setTimeout(() => connectRoom('client'), 350);
        } else {
          roomInput.value = randomRoomCode();
        }
      } catch (_) {}

      // =========================================================
      // 7. LEVEL & PHYSICS ENGINE
      // =========================================================
      function loadLevel(idx, broadcast = true) {
        currentLevelIdx = (idx + LEVELS.length) % LEVELS.length;
        document.getElementById('hud-level').textContent =
          String(currentLevelIdx + 1).padStart(2, '0') + ' / ' + String(LEVELS.length).padStart(2, '0');
        resetPlayerToSpawn(false);
        const sp = LEVELS[currentLevelIdx].spawn;
        remotePlayer.x = sp.x;
        remotePlayer.y = sp.y;
        remotePlayer.tx = sp.x;
        remotePlayer.ty = sp.y;
        if (broadcast && netConnected) {
          publishMsg({ type: 'level', idx: currentLevelIdx });
        }
      }

      function resetPlayerToSpawn(countDeath = false) {
        const sp = LEVELS[currentLevelIdx].spawn;
        const p = localPlayer;
        if (countDeath) {
          deaths++;
          document.getElementById('hud-deaths').textContent = deaths;
          screenShake = 8;
          playSound('die');
          spawnParticles(p.x + p.w / 2, p.y + p.h / 2, '#E63926', 14, 240);
        }
        p.x = sp.x;
        p.y = sp.y;
        p.vx = 0;
        p.vy = 0;
        p.ridingMoverIdx = -1;
        p.h = CFG.normalH;
        p.jumpsLeft = CFG.maxJumps;
        p.rollTimer = 0;
        p.airRollUsed = false;
        p.stamina = 100;
        p.exhausted = false;
        p.rot = 0;
        p.scaleX = 1.2;
        p.scaleY = 0.8;
      }

      let activeMovers = [];

      function updateMovers(t, dt) {
        const prevT = t - dt;
        activeMovers = LEVELS[currentLevelIdx].movers.map((m, idx) => {
          const s = (Math.sin(t * m.speed) + 1) * 0.5;
          const prevS = (Math.sin(prevT * m.speed) + 1) * 0.5;
          const x = m.ax + (m.bx - m.ax) * s;
          const y = m.ay + (m.by - m.ay) * s;
          const px = m.ax + (m.bx - m.ax) * prevS;
          const py = m.ay + (m.by - m.ay) * prevS;
          return { idx, x, y, w: m.w, h: m.h, dx: x - px, dy: y - py };
        });
      }

      function getActiveMovers() {
        return activeMovers;
      }

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function updatePhysics(dt) {
        const p = localPlayer;
        const lvl = LEVELS[currentLevelIdx];
        updateMovers(worldTime, dt);
        const movers = activeMovers;
        const allSolids = lvl.platforms.concat(movers);

        // Carry player cleanly with the moving platform they stood on last frame
        if (p.ridingMoverIdx >= 0 && movers[p.ridingMoverIdx]) {
          const rm = movers[p.ridingMoverIdx];
          p.x += rm.dx;
          p.y += rm.dy;
        }

        // Push player out if a moving platform sweeps into them
        for (const rm of movers) {
          if (rectsOverlap(p, rm)) {
            if (rm.dy < 0 && p.y + p.h > rm.y && p.y < rm.y) {
              p.y = rm.y - p.h;
              p.vy = Math.min(p.vy, 0);
              p.grounded = true;
            } else if (rm.dx > 0) {
              p.x = rm.x + rm.w;
            } else if (rm.dx < 0) {
              p.x = rm.x - p.w;
            }
          }
        }

        if (p.rollCooldownTimer > 0) p.rollCooldownTimer = Math.max(0, p.rollCooldownTimer - dt);
        if (p.jumpBufferTimer > 0) p.jumpBufferTimer = Math.max(0, p.jumpBufferTimer - dt);

        const moveDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (moveDir !== 0 && p.rollTimer <= 0) p.facing = moveDir;

        const wantsSprint = keys.sprint && moveDir !== 0 && p.rollTimer <= 0;
        if (wantsSprint && !p.exhausted && p.stamina > 0) {
          p.sprinting = true;
          p.stamina = Math.max(0, p.stamina - CFG.staminaDrain * dt);
          if (p.stamina === 0) p.exhausted = true;
        } else {
          p.sprinting = false;
          p.stamina = Math.min(100, p.stamina + CFG.staminaRegen * dt);
          if (p.exhausted && p.stamina >= CFG.staminaExhaustThreshold) {
            p.exhausted = false;
          }
        }

        const targetH = (p.rollTimer > 0 || (keys.down && p.grounded)) ? CFG.rollH : CFG.normalH;
        if (targetH !== p.h) {
          const diff = p.h - targetH;
          if (targetH > p.h) {
            const testBox = { x: p.x, y: p.y + diff, w: p.w, h: targetH };
            const blocked = allSolids.some((s) => rectsOverlap(testBox, s));
            if (!blocked) {
              p.y += diff;
              p.h = targetH;
            }
          } else {
            p.y += diff;
            p.h = targetH;
          }
        }

        if (p.rollTimer > 0) {
          p.rollTimer -= dt;
          p.rot += p.facing * 18 * dt;
          if (Math.random() < 0.65) {
            p.ghosts.push({ x: p.x, y: p.y, w: p.w, h: p.h, alpha: 0.45 });
          }
          if (p.rollTimer <= 0) {
            p.rot = 0;
          }
        } else {
          p.rot = 0;
          const maxSpd = p.sprinting ? CFG.sprintSpeed : CFG.walkSpeed;
          const targetVx = moveDir * maxSpd;
          const accel = p.grounded ? CFG.accelGround : CFG.accelAir;
          if (p.vx < targetVx) p.vx = Math.min(targetVx, p.vx + accel * dt);
          else if (p.vx > targetVx) p.vx = Math.max(targetVx, p.vx - accel * dt);
        }

        if (p.grounded) {
          p.coyoteTimer = CFG.coyoteTime;
          p.jumpsLeft = CFG.maxJumps;
          p.airRollUsed = false;
        } else {
          p.coyoteTimer = Math.max(0, p.coyoteTimer - dt);
        }

        if (p.jumpBufferTimer > 0) {
          if (p.coyoteTimer > 0) {
            p.vy = -CFG.jumpVel;
            p.grounded = false;
            p.coyoteTimer = 0;
            p.jumpBufferTimer = 0;
            p.jumpsLeft = CFG.maxJumps - 1;
            p.scaleX = 0.72;
            p.scaleY = 1.32;
            playSound('jump');
            spawnParticles(p.x + p.w / 2, p.y + p.h, '#16161A', 6, 130);
          } else if (p.jumpsLeft > 0) {
            p.vy = -CFG.doubleJumpVel;
            p.jumpsLeft--;
            p.jumpBufferTimer = 0;
            p.scaleX = 0.75;
            p.scaleY = 1.28;
            playSound('jump');
            spawnParticles(p.x + p.w / 2, p.y + p.h, '#EAB308', 8, 160);
          }
        }

        const grav = p.rollTimer > 0 ? CFG.gravity * 0.35 : (keys.down && !p.grounded ? CFG.gravity * 1.45 : CFG.gravity);
        p.vy = Math.min(980, p.vy + grav * dt);

        p.x += p.vx * dt;
        for (const s of allSolids) {
          if (rectsOverlap(p, s)) {
            if (p.vx > 0) p.x = s.x - p.w;
            else if (p.vx < 0) p.x = s.x + s.w;
            p.vx = 0;
          }
        }

        const wasGrounded = p.grounded;
        p.grounded = false;
        p.ridingMoverIdx = -1;
        p.y += p.vy * dt;
        for (const s of allSolids) {
          if (rectsOverlap(p, s)) {
            if (p.vy >= 0) {
              p.y = s.y - p.h;
              if (!wasGrounded && p.vy > 220) {
                p.scaleX = 1.32;
                p.scaleY = 0.7;
                playSound('land');
                spawnParticles(p.x + p.w / 2, p.y + p.h, '#16161A', 5, 100);
              }
              p.vy = 0;
              p.grounded = true;
              if (typeof s.idx === 'number') {
                p.ridingMoverIdx = s.idx;
              }
            } else if (p.vy < 0) {
              p.y = s.y + s.h;
              p.vy = 0;
            }
          }
        }

        if (p.grounded && p.sprinting && Math.random() < 0.35) {
          spawnParticles(p.x + p.w / 2, p.y + p.h, '#5A5962', 1, 60);
        }

        p.scaleX += (1 - p.scaleX) * Math.min(1, 14 * dt);
        p.scaleY += (1 - p.scaleY) * Math.min(1, 14 * dt);

        for (let i = p.ghosts.length - 1; i >= 0; i--) {
          p.ghosts[i].alpha -= 2.4 * dt;
          if (p.ghosts[i].alpha <= 0) p.ghosts.splice(i, 1);
        }

        if (p.y > 760) {
          resetPlayerToSpawn(true);
          return;
        }
        if (p.rollTimer <= 0) {
          for (const h of lvl.hazards) {
            if (rectsOverlap(p, h)) {
              resetPlayerToSpawn(true);
              return;
            }
          }
        }

        if (winBannerTimer <= 0 && rectsOverlap(p, lvl.goal)) {
          winBannerTimer = 1.1;
          playSound('win');
          spawnParticles(lvl.goal.x + lvl.goal.w / 2, lvl.goal.y + 20, '#EAB308', 22, 260);
          setTimeout(() => {
            winBannerTimer = 0;
            loadLevel(currentLevelIdx + 1, true);
          }, 950);
        }
      }

      function updateHUD() {
        const p = localPlayer;
        document.getElementById('jump-pip-1').classList.toggle('used', p.jumpsLeft < 1);
        document.getElementById('jump-pip-2').classList.toggle('used', p.jumpsLeft < 2);

        const dashPct = p.rollCooldownTimer > 0
          ? Math.round((1 - p.rollCooldownTimer / CFG.rollCooldown) * 100)
          : (p.airRollUsed && !p.grounded ? 0 : 100);
        const dashBar = document.getElementById('dash-bar');
        dashBar.style.width = dashPct + '%';
        dashBar.classList.toggle('dash-ready', dashPct === 100);

        const sprintBar = document.getElementById('sprint-bar');
        sprintBar.style.width = Math.round(p.stamina) + '%';
        sprintBar.classList.toggle('exhausted', p.exhausted);
      }

      // =========================================================
      // 8. RENDERER (Swiss Modular Grid + Risograph Misregistration)
      // =========================================================
      const cam = { x: 0, y: 0 };

      function resizeCanvas() {
        const wrap = document.getElementById('stage-wrap');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(wrap.clientWidth * dpr);
        canvas.height = Math.floor(wrap.clientHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);

      function drawSwissPlayer(p, color, label) {
        for (const g of p.ghosts) {
          ctx.save();
          ctx.globalAlpha = g.alpha * 0.55;
          ctx.fillStyle = '#1D4ED8';
          ctx.fillRect(g.x + 3, g.y + 3, g.w, g.h);
          ctx.restore();
        }

        const cx = p.x + p.w / 2;
        const bottom = p.y + p.h;
        const lean = p.sprinting ? p.facing * 0.12 : 0;

        ctx.save();
        ctx.translate(cx, bottom);
        ctx.scale(p.scaleX, p.scaleY);
        ctx.transform(1, 0, lean, 1, 0, 0);

        if (p.rollTimer > 0) {
          ctx.translate(0, -p.h / 2);
          ctx.rotate(p.rot);
          ctx.translate(0, p.h / 2);
        }

        ctx.fillStyle = '#16161A';
        ctx.fillRect(-p.w / 2 + 3, -p.h + 3, p.w, p.h);

        ctx.fillStyle = color;
        ctx.fillRect(-p.w / 2, -p.h, p.w, p.h);

        ctx.fillStyle = '#FCFBF7';
        const eyeX = p.facing > 0 ? 3 : -9;
        ctx.fillRect(eyeX, -p.h + 8, 6, 6);

        ctx.restore();

        ctx.save();
        ctx.fillStyle = '#16161A';
        ctx.font = '900 10px "Helvetica Neue", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, cx, p.y - 8);
        ctx.restore();
      }

      function render() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        const lvl = LEVELS[currentLevelIdx];

        const targetCamX = localPlayer.x - w * 0.36 + localPlayer.facing * 50;
        const targetCamY = Math.max(-140, Math.min(120, localPlayer.y - h * 0.58));
        cam.x += (targetCamX - cam.x) * 0.1;
        cam.y += (targetCamY - cam.y) * 0.08;

        const sx = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
        const sy = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;

        ctx.fillStyle = '#F3EFE6';
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.strokeStyle = '#DFD9CA';
        ctx.lineWidth = 1;
        const gridStep = 60;
        const offX = ((-cam.x * 0.6) % gridStep + gridStep) % gridStep;
        const offY = ((-cam.y * 0.6) % gridStep + gridStep) % gridStep;
        ctx.beginPath();
        for (let gx = offX; gx < w; gx += gridStep) {
          ctx.moveTo(gx, 0);
          ctx.lineTo(gx, h);
        }
        for (let gy = offY; gy < h; gy += gridStep) {
          ctx.moveTo(0, gy);
          ctx.lineTo(w, gy);
        }
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(-cam.x + sx, -cam.y + sy);

        ctx.fillStyle = '#DCD5C5';
        ctx.font = '900 110px "Helvetica Neue", sans-serif';
        ctx.fillText(lvl.id, 40, 260);

        ctx.fillStyle = '#16161A';
        ctx.font = '900 13px "Helvetica Neue", sans-serif';
        ctx.fillText(lvl.title, 44, 282);

        for (const n of lvl.notes) {
          ctx.fillStyle = '#16161A';
          ctx.font = '900 13px "Helvetica Neue", sans-serif';
          ctx.fillText(n.text, n.x, n.y);
          ctx.fillStyle = '#5A5962';
          ctx.font = '700 10px "Helvetica Neue", sans-serif';
          ctx.fillText(n.sub, n.x, n.y + 15);
        }

        const movers = getActiveMovers(worldTime);
        const solids = lvl.platforms.concat(movers);

        for (const s of solids) {
          ctx.fillStyle = '#D3CCBC';
          ctx.fillRect(s.x + 5, s.y + 5, s.w, s.h);
          ctx.fillStyle = '#16161A';
          ctx.fillRect(s.x, s.y, s.w, s.h);
          ctx.fillStyle = '#33323B';
          ctx.fillRect(s.x, s.y, s.w, 3);
        }

        for (const hz of lvl.hazards) {
          ctx.fillStyle = '#16161A';
          ctx.fillRect(hz.x + 2, hz.y + 2, hz.w, hz.h);
          ctx.fillStyle = '#E63926';
          ctx.fillRect(hz.x, hz.y, hz.w, hz.h);
        }

        const g = lvl.goal;
        ctx.fillStyle = '#16161A';
        ctx.fillRect(g.x + 4, g.y + 4, g.w, g.h);
        ctx.fillStyle = '#EAB308';
        ctx.fillRect(g.x, g.y, g.w, g.h);
        ctx.fillStyle = '#16161A';
        ctx.font = '900 10px "Helvetica Neue", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ФІНІШ', g.x + g.w / 2, g.y - 8);

        if (netConnected) {
          drawSwissPlayer(remotePlayer, '#1D4ED8', 'P2');
        }
        drawSwissPlayer(localPlayer, '#E63926', 'P1');

        for (const pt of particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
          ctx.translate(pt.x, pt.y);
          ctx.rotate(pt.rot);
          ctx.fillStyle = pt.color;
          ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
          ctx.restore();
        }

        ctx.restore();

        if (!paperPattern) {
          paperPattern = ctx.createPattern(grainCanvas, 'repeat');
        }
        if (paperPattern) {
          ctx.save();
          ctx.fillStyle = paperPattern;
          ctx.fillRect(0, 0, w, h);
          ctx.restore();
        }

        if (winBannerTimer > 0) {
          ctx.save();
          ctx.fillStyle = '#16161A';
          ctx.fillRect(w / 2 - 150, h / 2 - 32, 300, 64);
          ctx.fillStyle = '#EAB308';
          ctx.fillRect(w / 2 - 154, h / 2 - 36, 300, 64);
          ctx.fillStyle = '#16161A';
          ctx.font = '900 20px "Helvetica Neue", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('МОДУЛЬ ПРОЙДЕНО', w / 2 - 4, h / 2 + 3);
          ctx.restore();
        }
      }

      // =========================================================
      // 9. MAIN LOOP
      // =========================================================
      let lastTs = 0;

      function loop(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.033, (ts - lastTs) / 1000);
        lastTs = ts;
        worldTime += dt;

        if (screenShake > 0) screenShake = Math.max(0, screenShake - 28 * dt);

        updatePhysics(dt);
        updateHUD();

        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.vy += 420 * dt;
          pt.rot += 5 * dt;
          pt.life -= dt;
          if (pt.life <= 0) particles.splice(i, 1);
        }

        if (netConnected) {
          remotePlayer.x += (remotePlayer.tx - remotePlayer.x) * Math.min(1, 18 * dt);
          remotePlayer.y += (remotePlayer.ty - remotePlayer.y) * Math.min(1, 18 * dt);
          netSyncTimer += dt;
          if (netSyncTimer >= 0.03) {
            netSyncTimer = 0;
            sendStatePacket();
          }
          if (ts - lastPingSent > 2000) {
            lastPingSent = ts;
            publishMsg({ type: 'ping', t: performance.now() });
          }
        }

        render();
        requestAnimationFrame(loop);
      }

      window.onload = () => {
        resizeCanvas();
        loadLevel(0, false);
        requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
